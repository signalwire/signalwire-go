name: Doc & example audit (Layer C)

# Runs the porting-sdk audit_docs.py tool against the Go port so that every
# method reference inside markdown or example source resolves to a real
# symbol in port_surface_go.json (the Go-native sibling of port_surface.json
# produced by cmd/enumerate-surface alongside the Python-reference surface).
#
# Also compile-checks every example file -- //go:build swexample files included
# -- via ``go build -o /dev/null <file>`` to catch silent API breakage.
# (The examples are LINTED separately, at the library's bar, by layer 3 of
# scripts/run-lint.sh.)
#
# This is the third layer of the porting-sdk drift contract:
#
#   Layer A (live in porting-sdk)   parity checklist
#   Layer B (surface-audit.yml)     symbol-level surface parity with Python
#   Layer C (this workflow)         docs/examples reference only real symbols
#
# A phantom API in a guide is just as dangerous as a missing method; both
# lie to users about what the port supports.  This workflow catches the
# former.

env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    paths:
      - "docs/**"
      - "relay/docs/**"
      - "rest/docs/**"
      - "examples/**"
      - "relay/examples/**"
      - "rest/examples/**"
      - "pkg/**"
      - "cmd/enumerate-surface/**"
      - "DOC_AUDIT_IGNORE.md"
      - "port_surface_go.json"
      - ".github/workflows/doc-audit.yml"
  push:
    branches: [main]
  schedule:
    # Nightly re-run to catch upstream audit_docs.py rule tightening.
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-audit:
    runs-on: ubuntu-latest
    env:
      # The oracle-checkout root. cmd/enumerate-surface resolves porting-sdk from
      # $PORTING_SDK first, then a SIBLING ../porting-sdk (the local dev layout),
      # then an in-repo ./porting-sdk (what actions/checkout `path:` produces here).
      # It resolves either way now, but state it explicitly: the sibling-only walk
      # missing under this layout is what made the oracle load EMPTY, silently drop
      # every oracle-gated field, and produce a surface-audit red that could not be
      # reproduced locally.
      PORTING_SDK: ${{ github.workspace }}/porting-sdk
    steps:
      - name: Check out signalwire-go
        uses: actions/checkout@v7

      - name: Check out porting-sdk (audit script)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          path: porting-sdk
          # Coordinated-pass pin: 'main' normally; set the PORTING_SDK_REF repo variable
          # to a wave branch to test a coordinated porting-sdk change, declared on the PR
          # (see porting-sdk/COORDINATED_PASS.md). No revert commit.
          ref: ${{ vars.PORTING_SDK_REF || 'main' }}
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # This workflow checks out porting-sdk adjacent (above), so the TLS
      # capability tests in `go test ./...` (TestTLS_RelayClient_WSS /
      # TestTLS_RestClient_HTTPS) discover the mock harness and try to spawn
      # `python -m mock_{relay,signalwire} --tls`. Those mocks import
      # starlette/uvicorn/pyyaml, so without installing the harness the spawned
      # process dies on import and the test reports "mock --tls not ready"
      # instead of skipping. Install both harnesses so the TLS tests run for
      # real (the per-port `test.yml` does NOT check out porting-sdk, so there
      # the same tests skip — only this Layer C job exercises them).
      - name: Install Python test harnesses (mock_relay + mock_signalwire)
        run: |
          pip install -e porting-sdk/test_harness/mock_relay
          pip install -e porting-sdk/test_harness/mock_signalwire

      - name: Enumerate Go surface (Python + Go shapes)
        run: go run ./cmd/enumerate-surface

      - name: Verify committed port_surface_go.json is fresh
        run: go run ./cmd/enumerate-surface --check

      - name: Compile-check every example
        # Delegates to the canonical script rather than re-implementing the
        # loop here — this step used to be an inline copy of it, which is one
        # more place to drift when the example layout changes.
        run: bash scripts/compile_examples.sh

      - name: Run doc/example audit
        run: |
          python3 porting-sdk/scripts/audit_docs.py \
            --root . \
            --surface port_surface_go.json \
            --ignore DOC_AUDIT_IGNORE.md

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./...
        run: go test ./...
