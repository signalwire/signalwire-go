name: Symbol surface audit (Layer B)

# Runs the Go enumerator, then diffs ``port_surface.json`` against
# ``porting-sdk/python_surface.json`` to verify that every Python-reference
# public symbol either exists in the Go port or is explicitly recorded in
# ``PORT_OMISSIONS.md``.  Port-only extensions live in ``PORT_ADDITIONS.md``.
#
# This guards against silent API drift: if signalwire-python adds a public
# method and the Go port hasn't caught up, CI turns red.

env:
  # Opt into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    paths:
      - "pkg/**"
      - "cmd/enumerate-surface/**"
      - "PORT_OMISSIONS.md"
      - "PORT_ADDITIONS.md"
      - "port_surface.json"
      - ".github/workflows/surface-audit.yml"
  push:
    branches: [main]
  schedule:
    # Nightly re-run so the audit catches upstream Python-SDK additions
    # within 24h of porting-sdk regenerating python_surface.json.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-audit:
    runs-on: ubuntu-latest
    env:
      # The oracle-checkout root. cmd/enumerate-surface resolves porting-sdk from
      # $PORTING_SDK first, then a SIBLING ../porting-sdk (the local dev layout),
      # then an in-repo ./porting-sdk (what actions/checkout `path:` produces here).
      # It resolves either way now, but state it explicitly: the sibling-only walk
      # missing under this layout is what made the oracle load EMPTY, silently drop
      # every oracle-gated field, and produce a surface-audit red that could not be
      # reproduced locally.
      PORTING_SDK: ${{ github.workspace }}/porting-sdk
    steps:
      - name: Check out signalwire-go
        uses: actions/checkout@v7

      - name: Check out porting-sdk (reference surface)
        uses: actions/checkout@v7
        with:
          repository: signalwire/porting-sdk
          path: porting-sdk
          # Coordinated-pass pin: 'main' normally; set the PORTING_SDK_REF repo variable
          # to a wave branch to test a coordinated porting-sdk change, declared on the PR
          # (see porting-sdk/COORDINATED_PASS.md). No revert commit.
          ref: ${{ vars.PORTING_SDK_REF || 'main' }}
          token: ${{ secrets.PORTING_SDK_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Enumerate Go surface
        run: go run ./cmd/enumerate-surface --output port_surface.json

      - name: Verify committed port_surface.json is fresh
        run: |
          # The repo commits port_surface.json so reviewers can read diffs
          # without rebuilding Go.  Fail if the enumerator produces a
          # different snapshot than the committed one.
          go run ./cmd/enumerate-surface --check --output port_surface.json

      # Record WHICH porting-sdk the reference oracle came from. Without this the
      # job reports a symbol diff with no way to tell whether it ran against the
      # coordinated pin, main, or something else — and a coordinated-pass red is
      # then indistinguishable from a real one. (2026-07-25: a 107-symbol red here
      # could not be reproduced locally against either the pin tip or main, and the
      # log had no way to say which oracle it actually used.)
      - name: Record reference oracle provenance
        run: |
          echo "PORTING_SDK_REF variable = '${{ vars.PORTING_SDK_REF }}'"
          git -C porting-sdk rev-parse HEAD
          git -C porting-sdk log -1 --format='%h %cI %s'
          python3 -c "import json;d=json.load(open('porting-sdk/python_surface.json'));print('oracle generated_from:',d.get('generated_from'));c=d['modules'].get('signalwire.ai_chat.client',{}).get('classes',{});print('ai_chat ChatLog members:',c.get('ChatLog'))"
          echo "--- input fingerprints (md5) ---"
          md5sum porting-sdk/python_surface.json port_surface.json PORT_OMISSIONS.md PORT_ADDITIONS.md
          echo "--- what the PORT surface says for the symbols CI reports missing ---"
          python3 -c "import json;d=json.load(open('port_surface.json'));m=d['modules'];print('ai_chat classes:',m.get('signalwire.ai_chat.client',{}).get('classes',{}));print('CallReceiveEvent:',m.get('signalwire.relay.event',{}).get('classes',{}).get('CallReceiveEvent'))"
          echo "--- python + git identity ---"
          python3 -V; git -C . rev-parse HEAD

      - name: Diff against Python reference
        run: |
          python3 porting-sdk/scripts/diff_port_surface.py \
            --reference porting-sdk/python_surface.json \
            --port-surface port_surface.json \
            --omissions PORT_OMISSIONS.md \
            --additions PORT_ADDITIONS.md
